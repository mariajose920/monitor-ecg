<svg viewBox="0 0 1150 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1150" height="700" fill="#ffffff"/>

  <text x="575" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Sensor de Lactato Wearable — Diagrama de Bloques y Conexiones</text>
  <text x="575" y="54" text-anchor="middle" font-size="13" fill="#555555">Electrodo enzimático → AFE potenciostato (LMP91000) → MCU (ESP32) → BLE</text>

  <!-- ===================== ELECTRODO ===================== -->
  <g>
    <rect x="30" y="110" width="180" height="200" rx="10" fill="#eef6f0" stroke="#2e7d32" stroke-width="2"/>
    <text x="120" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">Electrodo enzimático</text>
    <text x="120" y="152" text-anchor="middle" font-size="11" fill="#33691e">(screen-printed, 3 electrodos)</text>

    <!-- WE pad -->
    <rect x="50" y="170" width="140" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="120" y="190" text-anchor="middle" font-size="12" fill="#1b5e20">WE — LOx + PB + Nafion</text>
    <!-- RE pad -->
    <rect x="50" y="210" width="140" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="120" y="230" text-anchor="middle" font-size="12" fill="#1b5e20">RE — Ag/AgCl</text>
    <!-- CE pad -->
    <rect x="50" y="250" width="140" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="120" y="270" text-anchor="middle" font-size="12" fill="#1b5e20">CE — Carbono</text>

    <text x="120" y="298" text-anchor="middle" font-size="10" fill="#555555">Sustrato PET flexible</text>
  </g>

  <!-- lines electrode -> LMP91000 -->
  <line x1="210" y1="185" x2="270" y2="185" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="178" text-anchor="middle" font-size="9" fill="#333333">WE</text>
  <line x1="210" y1="225" x2="270" y2="225" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="218" text-anchor="middle" font-size="9" fill="#333333">RE</text>
  <line x1="210" y1="265" x2="270" y2="265" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="258" text-anchor="middle" font-size="9" fill="#333333">CE</text>

  <!-- ===================== LMP91000 ===================== -->
  <g>
    <rect x="270" y="100" width="220" height="290" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
    <text x="380" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1a3a8f">LMP91000</text>
    <text x="380" y="142" text-anchor="middle" font-size="11" fill="#1a3a8f">AFE potenciostato</text>

    <rect x="288" y="160" width="184" height="26" rx="3" fill="#ffffff" stroke="#1a56db"/>
    <text x="380" y="178" text-anchor="middle" font-size="11" fill="#1a3a8f">C2 / WE (sensor)</text>
    <rect x="288" y="200" width="184" height="26" rx="3" fill="#ffffff" stroke="#1a56db"/>
    <text x="380" y="218" text-anchor="middle" font-size="11" fill="#1a3a8f">RE (bias virtual)</text>
    <rect x="288" y="240" width="184" height="26" rx="3" fill="#ffffff" stroke="#1a56db"/>
    <text x="380" y="258" text-anchor="middle" font-size="11" fill="#1a3a8f">CE (contraelectrodo)</text>

    <rect x="288" y="280" width="184" height="26" rx="3" fill="#fff3cd" stroke="#b8860b"/>
    <text x="380" y="298" text-anchor="middle" font-size="11" fill="#7a5c00">VOUT (TIA analógica)</text>

    <rect x="288" y="316" width="86" height="24" rx="3" fill="#e0f7fa" stroke="#00838f"/>
    <text x="331" y="333" text-anchor="middle" font-size="10" fill="#00575f">SDA</text>
    <rect x="386" y="316" width="86" height="24" rx="3" fill="#e0f7fa" stroke="#00838f"/>
    <text x="429" y="333" text-anchor="middle" font-size="10" fill="#00575f">SCL</text>

    <text x="380" y="375" text-anchor="middle" font-size="9" fill="#555555">VDD 3.3V / GND / MENB</text>
  </g>

  <!-- VOUT -> ESP32 ADC -->
  <line x1="490" y1="293" x2="560" y2="293" stroke="#b8860b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="286" text-anchor="middle" font-size="9" fill="#7a5c00">VOUT</text>

  <!-- I2C -> ESP32 -->
  <line x1="472" y1="328" x2="560" y2="328" stroke="#00838f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="516" y="321" text-anchor="middle" font-size="9" fill="#00575f">I2C (SDA/SCL)</text>

  <!-- ===================== ESP32 ===================== -->
  <g>
    <rect x="560" y="100" width="220" height="290" rx="10" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="2"/>
    <text x="670" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#4a148c">ESP32-WROOM</text>
    <text x="670" y="142" text-anchor="middle" font-size="11" fill="#4a148c">MCU + BLE</text>

    <rect x="578" y="160" width="184" height="26" rx="3" fill="#fff3cd" stroke="#b8860b"/>
    <text x="670" y="178" text-anchor="middle" font-size="11" fill="#7a5c00">ADC1_CH6 (GPIO34) ← VOUT</text>

    <rect x="578" y="200" width="86" height="24" rx="3" fill="#e0f7fa" stroke="#00838f"/>
    <text x="621" y="217" text-anchor="middle" font-size="10" fill="#00575f">GPIO21 SDA</text>
    <rect x="676" y="200" width="86" height="24" rx="3" fill="#e0f7fa" stroke="#00838f"/>
    <text x="719" y="217" text-anchor="middle" font-size="10" fill="#00575f">GPIO22 SCL</text>

    <rect x="578" y="240" width="184" height="26" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="670" y="258" text-anchor="middle" font-size="11" fill="#1b5e20">Deep Sleep / Timer wake</text>

    <rect x="578" y="280" width="184" height="26" rx="3" fill="#e1bee7" stroke="#6a1b9a"/>
    <text x="670" y="298" text-anchor="middle" font-size="11" fill="#4a148c">Radio BLE (GATT server)</text>

    <text x="670" y="375" text-anchor="middle" font-size="9" fill="#555555">3V3 / GND / EN</text>
  </g>

  <!-- BLE -> phone -->
  <path d="M 780 293 Q 830 260 880 250" stroke="#6a1b9a" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text x="845" y="240" text-anchor="middle" font-size="9" fill="#4a148c">BLE (notify)</text>

  <!-- ===================== APP / PC ===================== -->
  <g>
    <rect x="890" y="140" width="220" height="150" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
    <text x="1000" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#8e1c12">App móvil / PC</text>
    <text x="1000" y="186" text-anchor="middle" font-size="11" fill="#8e1c12">BLE Central</text>
    <rect x="908" y="205" width="184" height="26" rx="3" fill="#ffffff" stroke="#c0392b"/>
    <text x="1000" y="223" text-anchor="middle" font-size="10" fill="#8e1c12">Visualización en tiempo real</text>
    <rect x="908" y="240" width="184" height="26" rx="3" fill="#ffffff" stroke="#c0392b"/>
    <text x="1000" y="258" text-anchor="middle" font-size="10" fill="#8e1c12">App MATLAB (AppLactato.m)</text>
  </g>

  <!-- ===================== ALIMENTACION ===================== -->
  <g>
    <rect x="30" y="470" width="1080" height="180" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
    <text x="570" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#8e1c12">Etapa de alimentación</text>

    <rect x="60" y="520" width="200" height="60" rx="6" fill="#ffffff" stroke="#c0392b"/>
    <text x="160" y="545" text-anchor="middle" font-size="12" fill="#8e1c12">LiPo 3.7V</text>
    <text x="160" y="562" text-anchor="middle" font-size="11" fill="#8e1c12">150-200 mAh</text>

    <line x1="260" y1="550" x2="330" y2="550" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>

    <rect x="330" y="520" width="200" height="60" rx="6" fill="#ffffff" stroke="#c0392b"/>
    <text x="430" y="545" text-anchor="middle" font-size="12" fill="#8e1c12">TP4056</text>
    <text x="430" y="562" text-anchor="middle" font-size="11" fill="#8e1c12">Carga + proteccion Li-Po</text>

    <line x1="530" y1="550" x2="600" y2="550" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>

    <rect x="600" y="520" width="220" height="60" rx="6" fill="#ffffff" stroke="#c0392b"/>
    <text x="710" y="545" text-anchor="middle" font-size="12" fill="#8e1c12">AMS1117-3.3</text>
    <text x="710" y="562" text-anchor="middle" font-size="11" fill="#8e1c12">Regulador LDO 3.3V</text>

    <line x1="820" y1="550" x2="890" y2="550" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>

    <rect x="890" y="520" width="200" height="60" rx="6" fill="#ffffff" stroke="#c0392b"/>
    <text x="990" y="545" text-anchor="middle" font-size="12" fill="#8e1c12">Rail VDD 3.3V</text>
    <text x="990" y="562" text-anchor="middle" font-size="11" fill="#8e1c12">→ LMP91000 + ESP32</text>

    <text x="570" y="600" text-anchor="middle" font-size="10" fill="#555555">Autonomía estimada: ~48-72 h con lecturas periódicas (deep sleep entre muestras) y BLE bajo demanda</text>
  </g>

  <!-- VDD rail up to LMP91000 and ESP32 -->
  <line x1="990" y1="520" x2="990" y2="430" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="990" y1="430" x2="380" y2="430" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="380" y1="430" x2="380" y2="390" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <line x1="990" y1="430" x2="670" y2="430" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="670" y1="430" x2="670" y2="390" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <text x="900" y="423" text-anchor="middle" font-size="9" fill="#8e1c12">VDD 3.3V (a ambos chips)</text>

  <!-- legend -->
  <g font-size="10" fill="#333333">
    <line x1="30" y1="660" x2="55" y2="660" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="60" y="664">Señal / datos</text>
    <line x1="180" y1="660" x2="205" y2="660" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="210" y="664">Alimentación</text>
    <line x1="330" y1="660" x2="355" y2="660" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <text x="360" y="664">Enlace BLE (inalámbrico)</text>
  </g>
</svg>
